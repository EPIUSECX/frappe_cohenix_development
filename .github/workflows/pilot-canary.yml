name: Pilot latest

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: pilot-latest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  latest:
    name: Smoke test the current Pilot release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Export toolchain
        id: toolchain
        run: python3 scripts/export_toolchain.py --github-output

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compatibility unit tests
        env:
          PILOT_VERSION: ${{ steps.toolchain.outputs.PILOT_VERSION }}
        run: python -m unittest tests.test_pilot_compat tests.test_installer tests.test_pilot_release -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/v16/Dockerfile
          target: cohenix-v16
          load: true
          tags: ghcr.io/epiusecx/cohenix-frappe-dev:pilot-latest
          cache-from: type=gha,scope=cohenix-v16
          build-args: |
            PYTHON_VERSION=${{ steps.toolchain.outputs.PYTHON_VERSION }}
            NODE_VERSION=${{ steps.toolchain.outputs.NODE_VERSION }}
            YARN_VERSION=${{ steps.toolchain.outputs.YARN_VERSION }}
            UV_VERSION=${{ steps.toolchain.outputs.UV_VERSION }}
            PILOT_VERSION=${{ steps.toolchain.outputs.PILOT_VERSION }}
            BENCH_REF=${{ steps.toolchain.outputs.BENCH_REF }}
            COHENIX_IMAGE_TAG=v16

      - name: Smoke test current Pilot
        id: smoke
        continue-on-error: true
        env:
          COHENIX_DEV_IMAGE: ghcr.io/epiusecx/cohenix-frappe-dev:pilot-latest
          PILOT_VERSION: ${{ steps.toolchain.outputs.PILOT_VERSION }}
          COMPOSE_PROJECT_NAME: cohenix-pilot-latest
        run: |
          chmod +x tests/smoke/run-smoke.sh scripts/*.sh
          tests/smoke/run-smoke.sh

      - name: Write report
        if: always()
        run: |
          {
            echo "# Pilot release smoke"
            echo
            echo "- Tracking: \`${{ steps.toolchain.outputs.PILOT_VERSION }}\`"
            echo "- Smoke: ${{ steps.smoke.outcome }}"
            echo
            echo "Development environments install the newest Pilot release on \`devctl sync\`."
            echo "This job reports whether that release still provisions. It does not change the toolchain."
          } | tee pilot-latest-report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-latest-report
          path: pilot-latest-report.md
