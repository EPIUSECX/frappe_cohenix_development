name: CI

on:
  push:
    branches: [version-16_cohenix, cursor/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: CLI help
        run: |
          python -m pip install -e .
          devctl --help
          python installer.py --help

  toolchain:
    name: Toolchain agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export toolchain
        run: python scripts/export_toolchain.py
      - name: Dockerfile ARG defaults match toolchain.toml
        run: python -m unittest tests.test_installer.ToolchainAgreementTests -v
