[package]
name = "cohenix-pilot"
version = "0.1.0"
description = "Cohenix Pilot Windows desktop control plane"
authors = ["Cohenix"]
edition = "2021"
license = "MIT"

[lib]
name = "cohenix_pilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

keyring = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
