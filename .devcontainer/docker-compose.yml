services:
  mariadb:
    image: ${MARIADB_IMAGE:-docker.io/library/mariadb:11.8.9}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    # Not published on the host. Reach it as hostname `mariadb` from the Frappe container.

  postgresql:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:16.10-bookworm}
    profiles: ["postgres"]
    environment:
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-123}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: ${MAILPIT_IMAGE:-docker.io/axllent/mailpit:v1.31.4}
    profiles: ["mail"]
    volumes:
      - mailpit-data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    # Ports are forwarded from the Dev Container, not published host-wide.

  redis-cache:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7.4.2-alpine}
    profiles: ["legacy-redis"]

  redis-queue:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7.4.2-alpine}
    profiles: ["legacy-redis"]

  redis-socketio:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7.4.2-alpine}
    profiles: ["legacy-redis"]

  frappe:
    image: ${COHENIX_DEV_IMAGE:-ghcr.io/epiusecx/cohenix-frappe-dev:v16}
    build:
      context: ..
      dockerfile: images/v16/Dockerfile
      target: cohenix-v16
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14.2}
        NODE_VERSION: ${NODE_VERSION:-24.12.0}
        YARN_VERSION: ${YARN_VERSION:-1.22.22}
        UV_VERSION: ${UV_VERSION:-0.11.33}
        PILOT_VERSION: ${PILOT_VERSION:-v0.0.23-pre-alpha}
        BENCH_REF: ${BENCH_REF:-v5.31.0}
        COHENIX_IMAGE_TAG: ${DEV_IMAGE_TAG:-v16}
    init: true
    pull_policy: missing
    command: sleep infinity
    environment:
      SHELL: /bin/bash
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123}
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-16}
      PILOT_VERSION: ${PILOT_VERSION:-v0.0.23-pre-alpha}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.14.2}
      NODE_VERSION: ${NODE_VERSION:-24.12.0}
      PILOT_DIR: /home/frappe/pilot
      COHENIX_WORKSPACE: /workspace
      COHENIX_PROFILE: ${COHENIX_PROFILE:-hr}
      COHENIX_IMAGE_REF: ${COHENIX_DEV_IMAGE:-ghcr.io/epiusecx/cohenix-frappe-dev:v16}
      UV_CACHE_DIR: /home/frappe/.cache/uv
      YARN_CACHE_FOLDER: /home/frappe/.cache/yarn
      npm_config_cache: /home/frappe/.npm
    volumes:
      - ..:/workspace:cached
      - cohenix-pilot:/home/frappe/pilot
      - cohenix-uv-cache:/home/frappe/.cache/uv
      - cohenix-yarn-cache:/home/frappe/.cache/yarn
      - cohenix-npm-cache:/home/frappe/.npm
    working_dir: /workspace
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Development HTTP/realtime ports are forwarded by devcontainer.json,
    # not published on the host, so several environments can run at once.

  ui-tester:
    profiles: ["ui-tests"]
    image: ${CYPRESS_IMAGE:-docker.io/cypress/included:13.17.0}
    entrypoint: sleep infinity
    environment:
      SHELL: /bin/bash
      DISPLAY: ${DISPLAY:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ..:/workspace:z,cached
    network_mode: host

volumes:
  mariadb-data:
  postgresql-data:
  mailpit-data:
  cohenix-pilot:
  cohenix-uv-cache:
  cohenix-yarn-cache:
  cohenix-npm-cache:
