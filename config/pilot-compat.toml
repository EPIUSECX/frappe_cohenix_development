# Pilot compatibility audit against the pinned release and the canary release.
# Workarounds stay until a test proves the replacement is safe.

schema_version = 1
pinned = "v0.0.23-pre-alpha"
audited_canary = "v0.0.55-pre-alpha"

[[workarounds]]
id = "cli-packaging"
still_required_on_pinned = true
still_required_on_canary = false
reason = """
Pinned Pilot CLI imports top-level packaging during multi-app site install.
v0.0.55 vendors packaging as pilot._vendor.packaging. Keep the pip fallback
when import packaging fails so both releases work.

Do not symlink the uv venv python into ~/.local/bin: CPython then uses
~/.local as sys.prefix and the venv packages (including packaging) vanish.
devctl must invoke Pilot with VIRTUAL_ENV/bin/python3.
"""

[[workarounds]]
id = "cli-pymysql"
still_required_on_pinned = true
still_required_on_canary = true
reason = """
Pilot CLI still imports pymysql for MariaDB probes. The admin extra installs
it into .admin-venv, not the interpreter that runs bin/pilot.
"""

[[workarounds]]
id = "admin-venv"
still_required_on_pinned = true
still_required_on_canary = true
reason = "Admin UI still uses an isolated venv created from the admin extra."

[[workarounds]]
id = "redis-server"
still_required_on_pinned = true
still_required_on_canary = true
reason = "Pilot still has no external-Redis setting and runs its own redis-server."

[[workarounds]]
id = "incomplete-venv-recovery"
still_required_on_pinned = true
still_required_on_canary = true
reason = "uv venv refuses to reuse a directory that exists without bin/python."

[[workarounds]]
id = "bench-toml-not-initialized"
still_required_on_pinned = true
still_required_on_canary = true
reason = "pilot new writes bench.toml before init finishes; require apps/frappe too."

[[workarounds]]
id = "classic-bench-pids"
still_required_on_pinned = true
still_required_on_canary = true
reason = "frappe/bench is_bench_directory still requires config/pids."

[[workarounds]]
id = "shallow-clone-history"
still_required_on_pinned = true
still_required_on_canary = true
reason = "Release tarballs still clone apps with --depth 1 unless VERSION is 'dev'."

[[workarounds]]
id = "port-offset-publish"
still_required_on_pinned = true
still_required_on_canary = true
reason = "Pilot admin default is 7000; Dev Containers forward 8002 instead."

[[workarounds]]
id = "db-login-scope"
still_required_on_pinned = true
still_required_on_canary = true
reason = """
SiteCommands.create still does not pass --mariadb-user-host-login-scope.
Compose container IPs change on recreate, so the grant is repaired to '%'.
"""

[[workarounds]]
id = "temporary-redis-for-sites"
still_required_on_pinned = true
still_required_on_canary = true
reason = "new-site needs Redis, but Pilot only starts Redis inside `pilot start`."

[[workarounds]]
id = "assets-json"
still_required_on_pinned = true
still_required_on_canary = true
reason = """
build_missing_assets still keys off sites/assets/<app> (a symlink created by
linking), not assets.json, so a linked bench can serve a broken desk.
"""

[[workarounds]]
id = "default-site-host"
still_required_on_pinned = true
still_required_on_canary = true
reason = "Pilot has no new-site --set-default; localhost would 404 without serve_default_site."

[[workarounds]]
id = "bench-start-shim"
still_required_on_pinned = true
still_required_on_canary = true
reason = """
Pilot writes no Procfile; `bench start` must delegate to Pilot. The v2 shim
also maps `bench stop`/`restart`/`reload` onto Pilot and, after mutating
commands such as install-app, writes pids/reload.request so workers pick up
the new app without a full Pilot stop/start.
"""

[[workarounds]]
id = "worker-reload"
still_required_on_pinned = true
still_required_on_canary = true
reason = """
Neither classic `bench --site X install-app` (Frappe CLI) nor Pilot's
install-app command restarts running web/workers. Classic Bench.reload()
only knows Overmind. Desk then AJAX-errors until a full Pilot restart.
devctl reload (and the bench/pilot shims) use Pilot's pids/reload.request
IPC so Redis, watch, and admin stay up.
"""

[[workarounds]]
id = "procfile-omits-scheduler"
still_required_on_pinned = true
still_required_on_canary = true
reason = """
Pilot's generated Procfile has web, socketio, workers, redis, and watch, but
not `frappe schedule`. devctl start adds the line and starts the process.
"""

[[workarounds]]
id = "migrate-needs-redis"
still_required_on_pinned = true
still_required_on_canary = true
reason = """
frappe migrate refuses to run unless redis_cache is up. Site create already
migrates; extra migrate after create_sites must keep Redis running.
"""

[[workarounds]]
id = "venv-python-symlink"
still_required_on_pinned = true
still_required_on_canary = true
reason = """
Pilot's shebang is #!/usr/bin/env python3. A symlink of the uv venv python
into ~/.local/bin makes CPython use that directory as sys.prefix, hiding
packaging. Invoke Pilot with VIRTUAL_ENV/bin/python3.
"""

[[workarounds]]
id = "skip-install-sh"
still_required_on_pinned = true
still_required_on_canary = true
reason = "install.sh still wants to install MariaDB/nginx/supervisor on the host."
